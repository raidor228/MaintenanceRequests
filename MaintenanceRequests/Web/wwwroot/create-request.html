<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание заявки</title>
    <link rel="stylesheet" href="css/site.css">
</head>

<body>

<h1>Создание заявки</h1>

<form id="createRequestForm">

    <div>
        <label for="title">
            Название
        </label>

        <input
                id="title"
                name="title"
                type="text"
                required>
    </div>

    <div>
        <label for="description">
            Описание
        </label>

        <textarea
                id="description"
                name="description"
                required>
            </textarea>
    </div>

    <div>
        <label for="priority">
            Приоритет
        </label>

        <select id="priority" name="priority">
            <option value="0">Низкий</option>
            <option value="1">Обычный</option>
            <option value="2">Высокий</option>
            <option value="3">Критический</option>
        </select>
    </div>

    <div>
        <label for="category">
            Категория
        </label>

        <select id="category" name="categoryId" required>
            <option value="">
                Выберите категорию
            </option>
        </select>
    </div>

    <button type="submit">
        Создать заявку
    </button>

</form>

<script src="js/requests.js"></script>

</body>
</html>
